<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de Mídias - Archive</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #0d0d0d; color: #fff; font-family: Arial, sans-serif; }
  h1 { color: #1db954; text-align: center; }
  #busca { width: 100%; padding: 14px; margin-bottom: 16px; border-radius: 8px; border: 1px solid #333; background: #222; color: #fff; font-size: 16px; }
  .card { background: #1c1c1c; border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .tag { display: inline-block; background: #333; padding: 6px 10px; border-radius: 6px; font-size: 13px; text-transform: uppercase; }
  .titulo { font-weight: bold; margin: 12px 0; font-size: 17px; }
  button.play { width: 100%; padding: 14px; background: #1db954; color: #fff; border: 0; border-radius: 8px; font-size: 17px; font-weight: bold; }
  #player { display: none; position: fixed; inset: 0; background: #000; z-index: 10; flex-direction: column; }
  #player.aberto { display: flex; }
  #player .topo { padding: 10px; display: flex; gap: 10px; align-items: center; background: #111; }
  #player .topo span { flex: 1; font-size: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #player .topo button { background: #e53935; color: #fff; border: 0; padding: 10px 16px; border-radius: 8px; font-size: 15px; }
  #player iframe { flex: 1; width: 100%; border: 0; }
</style>
</head>
<body>
  <h1>Catálogo de Mídias - Archive</h1>
  <input id="busca" placeholder="Pesquisar filme, série, desenho ou música...">
  <div id="lista"></div>

  <div id="player">
    <div class="topo"><span id="player-titulo"></span><button onclick="fechar()">Fechar</button></div>
    <iframe id="frame" allowfullscreen allow="autoplay; fullscreen"></iframe>
  </div>

<script>
  let itens = [];
  const lista = document.getElementById("lista");

  fetch("playlist.json")
    .then(r => r.json())
    .then(d => { itens = d; mostrar(itens); })
    .catch(() => { lista.textContent = "Erro ao carregar a lista."; });

  function mostrar(arr) {
    lista.innerHTML = "";
    arr.forEach(item => {
      const card = document.createElement("div");
      card.className = "card";

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = item.type || "";

      const t = document.createElement("div");
      t.className = "titulo";
      t.textContent = item.title;

      const b = document.createElement("button");
      b.className = "play";
      b.textContent = "Assistir / Ouvir";
      b.onclick = () => abrir(item);

      card.append(tag, t, b);
      lista.appendChild(card);
    });
  }

  function abrir(item) {
    document.getElementById("player-titulo").textContent = item.title;
    document.getElementById("frame").src = "https://archive.org/embed/" + encodeURIComponent(item.identifier);
    document.getElementById("player").classList.add("aberto");
  }

  function fechar() {
    document.getElementById("frame").src = "";
    document.getElementById("player").classList.remove("aberto");
  }

  document.getElementById("busca").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();
    mostrar(itens.filter(i => (i.title || "").toLowerCase().includes(q)));
  });
</script>
</body>
</html>
